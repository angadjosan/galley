    - generic [ref=f5e53]:
      - main [ref=f5e54]:
        - generic "Document" [ref=f5e57]:
          - heading [level=1] [ref=f5e58]:
            - button "Insert below" [ref=f5e59] [cursor=pointer]: +
            - text: Galley
          - paragraph [ref=f5e60]:
            - button "Insert below" [ref=f5e61] [cursor=pointer]: +
            - strong [ref=f5e62]: Design doc, v0.3
          - paragraph [ref=f5e63]:
            - button "Insert below" [ref=f5e64] [cursor=pointer]: +
            - text: A galley proof is the draft you circulate before publication — the version that exists to be marked up. That's the product.
          - separator [ref=f5e65]
          - heading [level=2] [ref=f5e66]:
            - button "Insert below" [ref=f5e67] [cursor=pointer]: +
            - text: The one sentence
          - paragraph [ref=f5e68]:
            - button "Insert below" [ref=f5e69] [cursor=pointer]: +
            - text: A Google Docs–grade writing surface for people who don't write Markdown, where the artifact it produces is clean, block-addressable Markdown that agents can read, cite, and edit.
          - separator [ref=f5e70]
          - heading [level=2] [ref=f5e71]:
            - button "Insert below" [ref=f5e72] [cursor=pointer]: +
            - text: The thesis
          - paragraph [ref=f5e73]:
            - button "Insert below" [ref=f5e74] [cursor=pointer]: +
            - text: "Every document written today has a second audience nobody designed for: a model."
          - paragraph [ref=f5e75]:
            - button "Insert below" [ref=f5e76] [cursor=pointer]: +
            - text: Specs get pasted into coding agents. Policies get scraped into retrieval pipelines. Runbooks get handed to an assistant that's supposed to follow them. The doc is no longer a thing a person reads once — it's
            - strong [ref=f5e77]: context
            - text: ", consumed repeatedly by machines, and every tool people currently write in is hostile to that."
          - paragraph [ref=f5e78]:
            - button "Insert below" [ref=f5e79] [cursor=pointer]: +
            - text: Notion exports mangled Markdown and hides the good stuff behind an API you have to crawl. Google Docs is a rendering format pretending to be a storage format. Confluence is a database with a WYSIWYG on top. In all three, getting a document
            - emphasis [ref=f5e80]: out
            - text: in a form a model can use is a lossy export job, and there is no way for a model to point back at the paragraph it used.
          - paragraph [ref=f5e81]:
            - button "Insert below" [ref=f5e82] [cursor=pointer]: +
            - text: The people writing these documents are not engineers. They are PMs, designers, support leads, ops, founders, technical writers, marketers. They will never type
            - code [ref=f5e83]: "**bold**"
            - text: and they should never have to.
          - blockquote [ref=f5e84]:
            - button "Insert below" [ref=f5e85] [cursor=pointer]: +
            - paragraph [ref=f5e86]:
              - strong [ref=f5e87]: A document has two audiences. Write for the human, store for the machine.
          - paragraph [ref=f5e88]:
            - button "Insert below" [ref=f5e89] [cursor=pointer]: +
            - text: That's the product. Not "Markdown for normies." Not "docs in git." A writing surface where the thing that comes out the other end is already the thing your agents need.
          - separator [ref=f5e90]
          - heading [level=2] [ref=f5e91]:
            - button "Insert below" [ref=f5e92] [cursor=pointer]: +
            - text: Why anyone uses this
          - paragraph [ref=f5e93]:
            - button "Insert below" [ref=f5e94] [cursor=pointer]: +
            - text: "Concretely, in order of how often it will be the reason:"
          - list [ref=f5e95]:
            - button "Insert below" [ref=f5e96] [cursor=pointer]: +
            - listitem [ref=f5e97]:
              - paragraph [ref=f5e98]:
                - strong [ref=f5e99]: What you paste into an agent is correct.
                - text: No export step, no mangled tables, no lost structure. The doc
                - emphasis [ref=f5e100]: is
                - text: the context.
            - listitem [ref=f5e101]:
              - paragraph [ref=f5e102]:
                - strong [ref=f5e103]: Agents can cite you back.
                - text: An answer says "per §Refunds/¶3" and that resolves to a real block you can click. Retrieval stops being a black box.
            - listitem [ref=f5e104]:
              - paragraph [ref=f5e105]:
                - strong [ref=f5e106]: An agent can propose an edit and you can review it like a person's edit.
                - text: Not a chat window that regenerates your document — a suggestion on a paragraph, with a diff, that you accept or reject.
            - listitem [ref=f5e107]:
              - paragraph [ref=f5e108]:
                - strong [ref=f5e109]: Stale docs get caught.
                - text: A doc that feeds agents is worse than useless when it's wrong — it launders bad information into confident answers. Blocks know when they were last touched and by whom, and what's reading them.
            - listitem [ref=f5e110]:
              - paragraph [ref=f5e111]:
                - strong [ref=f5e112]: It opens anywhere, forever.
                - text: The file is CommonMark. No proprietary format, no export hostage situation.
          - paragraph [ref=f5e113]:
            - button "Insert below" [ref=f5e114] [cursor=pointer]: +
            - text: Note what's
            - emphasis [ref=f5e115]: not
            - text: "on that list: real-time multiplayer. It's table stakes, it has to work, and it is not why anyone switches."
          - separator [ref=f5e116]
          - heading [level=2] [ref=f5e117]:
            - button "Insert below" [ref=f5e118] [cursor=pointer]: +
            - text: Two walkthroughs
          - paragraph [ref=f5e119]:
            - button "Insert below" [ref=f5e120] [cursor=pointer]: +
            - text: The architecture below only makes sense against these. If a decision doesn't serve one of them, it's out of scope.
          - heading [level=3] [ref=f5e121]:
            - button "Insert below" [ref=f5e122] [cursor=pointer]: +
            - text: A. Human writes, agent consumes
          - paragraph [ref=f5e123]:
            - button "Insert below" [ref=f5e124] [cursor=pointer]: +
            - text: Priya is a PM. She writes a spec in Galley — bold text, headings, a table of API fields, a callout for the open question. She never sees a
            - code [ref=f5e125]: "#"
            - text: or a
            - code [ref=f5e126]: "|"
            - text: .
          - paragraph [ref=f5e127]:
            - button "Insert below" [ref=f5e128] [cursor=pointer]: +
            - text: She finishes and hands it to a coding agent. Not by copy-paste — she says "implement the spec at
            - code [ref=f5e129]: specs/checkout-v2
            - text: ",\" and the agent runs"
            - code [ref=f5e130]: galley read specs/checkout-v2
            - text: ". It gets Markdown on stdout: the same bytes that are on disk, no conversion, the table as a table, the callout as a callout, and a stable ID on every block."
          - paragraph [ref=f5e131]:
            - button "Insert below" [ref=f5e132] [cursor=pointer]: +
            - text: "The agent implements it, and comes back with: \"§API Fields/¶2 says"
            - code [ref=f5e133]: currency
            - text: is optional but §Validation/¶1 requires it. Which?" That's a comment thread anchored to both blocks. Priya answers in the thread, in prose, in her inbox.
          - heading [level=3] [ref=f5e134]:
            - button "Insert below" [ref=f5e135] [cursor=pointer]: +
            - text: B. Agent writes, human reviews
          - paragraph [ref=f5e136]:
            - button "Insert below" [ref=f5e137] [cursor=pointer]: +
            - text: "The same spec, three weeks later. The implementation drifted. A coding agent that touched the code notices the doc no longer matches and proposes an edit: two paragraphs rewritten, one table row changed."
          - paragraph [ref=f5e138]:
            - button "Insert below" [ref=f5e139] [cursor=pointer]: +
            - text: It lands as a
            - strong [ref=f5e140]: suggestion
            - text: — highlighted, attributed, diffable, scoped to exactly those blocks. Priya accepts one, rejects one, edits the third herself. The comment thread she had on one of those paragraphs is still attached afterward, because the paragraph kept its identity through the rewrite.
          - paragraph [ref=f5e141]:
            - button "Insert below" [ref=f5e142] [cursor=pointer]: +
            - text: Everything hard in this document is downstream of that last sentence.
          - separator [ref=f5e143]
          - heading [level=2] [ref=f5e144]:
            - button "Insert below" [ref=f5e145] [cursor=pointer]: +
            - text: Principles
          - paragraph [ref=f5e146]:
            - button "Insert below" [ref=f5e147] [cursor=pointer]: +
            - strong [ref=f5e148]: I. Markdown is the format, not the interface.
            - text: WYSIWYG always. Source view is a toggle for people who want it, never a mode anyone is dropped into. Get this wrong and you've built HackMD with a nicer logo.
          - paragraph [ref=f5e149]:
            - button "Insert below" [ref=f5e150] [cursor=pointer]: +
            - strong [ref=f5e151]: II. Every block has a stable identity.
            - text: This is the technical thesis. Block identity is what makes comments, agent scoping, citation, transclusion, attribution, and staleness all work — six features that are secretly one feature. It's also the one real gap in Markdown.
          - paragraph [ref=f5e152]:
            - button "Insert below" [ref=f5e153] [cursor=pointer]: +
            - strong [ref=f5e154]: III. Humans and agents share one model.
            - text: "An agent is a cursor, an author, a commenter, and a permission subject — not a chat sidebar bolted onto the side. The reason this matters isn't philosophical: it's"
            - strong [ref=f5e155]: scoping
            - text: . An agent mentioned in a thread gets one anchored paragraph and its surroundings, not 40kb of document. Precision in, precision out.
          - paragraph [ref=f5e156]:
            - button "Insert below" [ref=f5e157] [cursor=pointer]: +
            - strong [ref=f5e158]: IV. Every extension degrades to valid CommonMark.
            - text: The temptation is to invent a richer format. Resist it — that's how you get a walled garden and lose "opens anywhere," which is half the value.
          - separator [ref=f5e159]
          - heading [level=2] [ref=f5e160]:
            - button "Insert below" [ref=f5e161] [cursor=pointer]: +
            - text: What agents actually need, and what to build for it
          - paragraph [ref=f5e162]:
            - button "Insert below" [ref=f5e163] [cursor=pointer]: +
            - text: "Being \"agent-native\" is four concrete capabilities, not a vibe:"
          - table [ref=f5e164]:
            - rowgroup [ref=f5e165]:
              - button "Insert below" [ref=f5e166] [cursor=pointer]: +
              - row [ref=f5e167]:
                - columnheader "Capability" [ref=f5e168]
                - columnheader "What to build" [ref=f5e169]
              - row [ref=f5e170]:
                - cell [ref=f5e171]:
                  - strong [ref=f5e172]: Read
                  - text: a doc as clean Markdown, no export step
                - cell [ref=f5e173]:
                  - text: The file on disk
                  - emphasis [ref=f5e174]: is
                  - text: the payload. Same bytes.
              - row [ref=f5e175]:
                - cell [ref=f5e176]:
                  - strong [ref=f5e177]: Address
                  - text: a specific block, stably, across edits
                - cell "Block IDs, durable through rewrites (see below)" [ref=f5e178]
              - row [ref=f5e179]:
                - cell [ref=f5e180]:
                  - strong [ref=f5e181]: Cite
                  - text: back in a way a human can verify
                - cell [ref=f5e182]:
                  - code [ref=f5e183]: doc#block
                  - text: resolves to a scroll-and-highlight in the app
              - row [ref=f5e184]:
                - cell [ref=f5e185]:
                  - strong [ref=f5e186]: Propose
                  - text: an edit that a human reviews
                - cell "Suggestions as first-class objects, not direct writes" [ref=f5e187]
          - heading [level=3] [ref=f5e188]:
            - button "Insert below" [ref=f5e189] [cursor=pointer]: +
            - text: The interface is a CLI, plus skills
          - paragraph [ref=f5e190]:
            - button "Insert below" [ref=f5e191] [cursor=pointer]: +
            - text: Not a server. Agents already have a shell — that's the one capability every harness has in common, and it's the only integration surface that costs nothing to adopt.
          - code [ref=f5e193]:
            - button "Insert below" [ref=f5e194] [cursor=pointer]: +
            - text: "galley pull ./docs # mirror a workspace to disk galley read specs/checkout-v2 # clean Markdown on stdout galley read specs/checkout-v2#a1b2c3 # one block galley search \"refund policy\" # matching blocks, as doc#block refs galley comment <ref> \"...\" # anchored comment galley suggest <ref> --from patch.md # propose an edit (block-scoped ops) galley status # what changed, what's stale, what's pending"
          - paragraph [ref=f5e195]:
            - button "Insert below" [ref=f5e196] [cursor=pointer]: +
            - text: "Two things follow from this that a server surface doesn't give you:"
          - paragraph [ref=f5e197]:
            - button "Insert below" [ref=f5e198] [cursor=pointer]: +
            - strong [ref=f5e199]:
              - code [ref=f5e200]: galley pull
              - text: means the best agent interface is no interface.
            - text: "Mirror the workspace and the docs are just files in a folder. Every coding agent already knows how to read files — no tool definition, no connector, no protocol. The CLI is for the operations a filesystem can't express: addressing a block, searching semantically, posting a comment, proposing an edit."
          - paragraph [ref=f5e201]:
            - button "Insert below" [ref=f5e202] [cursor=pointer]: +
            - strong [ref=f5e203]: Stdout composes.
            - code [ref=f5e204]: galley read spec | claude -p "implement this"
            - text: is a real workflow. So is a CI job that runs
            - code [ref=f5e205]: galley status --stale
            - text: and fails when a doc that feeds production agents has drifted from the code. Long-lived connections can't do that; a binary can.
          - paragraph [ref=f5e206]:
            - button "Insert below" [ref=f5e207] [cursor=pointer]: +
            - strong [ref=f5e208]: Skills carry the etiquette that the CLI can't enforce.
            - text: The CLI gives an agent
            - emphasis [ref=f5e209]: capability
            - text: ; a Galley skill gives it
            - emphasis [ref=f5e210]: behavior
            - text: — the citation convention, the comment budget, suggestion-before-write, how to scope a rewrite so block identity survives. Skills are files, so they version with the workspace and travel to whatever harness the user runs. Ship a first-party one, let teams fork it.
          - paragraph [ref=f5e211]:
            - button "Insert below" [ref=f5e212] [cursor=pointer]: +
            - strong [ref=f5e213]: Permissions.
            - code [ref=f5e214]: galley auth login
            - text: issues a scoped token to an
            - emphasis [ref=f5e215]: (agent, human sponsor)
            - text: "pair — the agent is its own principal, never an impersonation of the sponsor, and its grants are always a subset of theirs. An agent's permissions are otherwise the same object as a human's: read"
            - code [ref=f5e216]: /policies
            - text: ", suggest on"
            - code [ref=f5e217]: /specs
            - text: ", write nowhere is a normal thing to express. Every command is auditable and replayable, which a persistent session is not."
          - paragraph [ref=f5e218]:
            - button "Insert below" [ref=f5e219] [cursor=pointer]: +
            - text: "The honest cost: a CLI can't push. An agent can't be"
            - emphasis [ref=f5e220]: notified
            - text: that someone replied to its comment — it has to be run again and poll
            - code [ref=f5e221]: galley status
            - text: . For the workflows above that's fine, and if a subscription surface is ever needed it can wrap the same commands.
          - separator [ref=f5e222]
          - heading [level=2] [ref=f5e223]:
            - button "Insert below" [ref=f5e224] [cursor=pointer]: +
            - text: Architecture
          - heading [level=3] [ref=f5e225]:
            - button "Insert below" [ref=f5e226] [cursor=pointer]: +
            - text: The sync engine
          - code [ref=f5e228]:
            - button "Insert below" [ref=f5e229] [cursor=pointer]: +
            - text: local file ←────── projection writer (splicing) (clean .md) ──────→ fs watcher ──┐ ↓ ┌────────────────┐ browser session ←────────→│ CRDT (doc) │ agent via CLI ←────────→│ authoritative │ mobile ←────────→└────────────────┘ ↓ sidecar store (block map, comments, suggestions, history, presence)
          - paragraph [ref=f5e230]:
            - button "Insert below" [ref=f5e231] [cursor=pointer]: +
            - text: "Two modes, one code path:"
          - list [ref=f5e232]:
            - button "Insert below" [ref=f5e233] [cursor=pointer]: +
            - listitem [ref=f5e234]:
              - paragraph [ref=f5e235]:
                - strong [ref=f5e236]: Cloud-native
                - text: — no local file. The doc lives in the CRDT store. This is the default and it's where most users live.
            - listitem [ref=f5e237]:
              - paragraph [ref=f5e238]:
                - strong [ref=f5e239]: Local mirror
                - text: — you point Galley at a file or folder on disk, typically because that's where your coding agents read from. Session opens, file is ingested, CRDT becomes authoritative, the projection writer keeps the file current in real time.
          - blockquote [ref=f5e240]:
            - button "Insert below" [ref=f5e241] [cursor=pointer]: +
            - paragraph [ref=f5e242]:
              - strong [ref=f5e243]: "Law: during a session, the CRDT is the source of truth. The local file is a continuously-written projection of it."
          - paragraph [ref=f5e244]:
            - button "Insert below" [ref=f5e245] [cursor=pointer]: +
            - text: External edits to the file are
            - emphasis [ref=f5e246]: inbound operations
            - text: ", not a competing version — diffed against the projection and applied as ops attributed to"
            - code [ref=f5e247]: local filesystem
            - text: . No merge dialog, ever.
          - paragraph [ref=f5e248]:
            - button "Insert below" [ref=f5e249] [cursor=pointer]: +
            - text: Build on
            - strong [ref=f5e250]: Loro
            - text: "rather than Yjs. This isn't a coin flip: two v1 requirements decide it. History-as-UX needs cheap version checkout, and suggestion review benefits from real branching. Yjs makes both into custom work. (Writing your own CRDT is a two-year detour that adds nothing a user can see.)"
          - heading [level=3] [ref=f5e251]:
            - button "Insert below" [ref=f5e252] [cursor=pointer]: +
            - text: "The projection writer: splice, don't re-serialize"
          - paragraph [ref=f5e253]:
            - button "Insert below" [ref=f5e254] [cursor=pointer]: +
            - text: "The failure mode that kills editors in this category: you open a file, save it, and it silently reformats. Markdown is not a canonical serialization —"
            - code [ref=f5e255]: "*"
            - text: vs
            - code [ref=f5e256]: "-"
            - text: bullets,
            - code [ref=f5e257]: _em_
            - text: vs
            - code [ref=f5e258]: "*em*"
            - text: ", ATX vs setext headings, nested-list indent width, two-space hard breaks, table pipe padding, escaping rules. Many ASTs produce the same text; many texts produce the same AST. Any AST→text serializer will reformat every file that wasn't already in its canonical style."
          - paragraph [ref=f5e259]:
            - button "Insert below" [ref=f5e260] [cursor=pointer]: +
            - text: So don't serialize the document.
            - strong [ref=f5e261]: Keep source ranges per node, re-emit only the nodes that changed, and leave every untouched byte literally untouched.
          - paragraph [ref=f5e262]:
            - button "Insert below" [ref=f5e263] [cursor=pointer]: +
            - text: "And say the honest part out loud rather than letting users find it in a diff:"
          - blockquote [ref=f5e264]:
            - button "Insert below" [ref=f5e265] [cursor=pointer]: +
            - paragraph [ref=f5e266]:
              - strong [ref=f5e267]: First ingest normalizes, once, as a visible and explicit act. Every save after that is byte-stable.
          - paragraph [ref=f5e268]:
            - button "Insert below" [ref=f5e269] [cursor=pointer]: +
            - text: Normalization is a thing the user agrees to when they connect a file, not a bug they discover later. After it, editing one paragraph produces a one-paragraph diff. This is a P0 architectural commitment with a P0 test suite behind it — round-trip a large corpus of real-world Markdown, assert byte equality on no-op open/save.
          - heading [level=3] [ref=f5e270]:
            - button "Insert below" [ref=f5e271] [cursor=pointer]: +
            - text: Block identity
          - paragraph [ref=f5e272]:
            - button "Insert below" [ref=f5e273] [cursor=pointer]: +
            - text: "The mechanism, in priority order — the ordering is the whole point:"
          - list [ref=f5e274]:
            - button "Insert below" [ref=f5e275] [cursor=pointer]: +
            - listitem [ref=f5e276]:
              - paragraph [ref=f5e277]:
                - strong [ref=f5e278]: IDs are authoritative in the CRDT.
                - text: Any edit made through Galley — by a human, or by an agent through the CLI — carries block identity through the edit, because the editor knows which paragraph it is
                - emphasis [ref=f5e279]: while
                - text: it rewrites it. This is the path that must survive Walkthrough B.
            - listitem [ref=f5e280]:
              - paragraph [ref=f5e281]:
                - strong [ref=f5e282]: Fuzzy re-anchoring is the fallback
                - text: ", used only for edits that arrive through the filesystem, where identity was never in the payload. Content-similarity plus structural position, with an explicit confidence threshold."
            - listitem [ref=f5e283]:
              - paragraph [ref=f5e284]:
                - strong [ref=f5e285]: Below threshold, the anchor is orphaned, not guessed.
                - text: Orphaned comments surface in a per-doc tray with their last-known text, reattachable in one click. Silently reattaching a comment to the wrong paragraph is worse than losing it.
          - paragraph [ref=f5e286]:
            - button "Insert below" [ref=f5e287] [cursor=pointer]: +
            - text: Content hashing alone is not sufficient and shouldn't be the primary key — two identical
            - code [ref=f5e288]: "## Setup"
            - text: headings or two short identical paragraphs collide by construction.
          - paragraph [ref=f5e289]:
            - button "Insert below" [ref=f5e290] [cursor=pointer]: +
            - strong [ref=f5e291]: Materialization.
            - text: IDs live in the sidecar. Only when a block acquires something durable — a comment thread, an inbound citation, an agent task — is the ID written into the file as an HTML comment (
            - code [ref=f5e292]: <!-- ^a1b2c3 -->
            - text: ), invisible in every CommonMark renderer.
          - paragraph [ref=f5e293]:
            - button "Insert below" [ref=f5e294] [cursor=pointer]: +
            - text: "A doc nobody has annotated is byte-for-byte clean Markdown. A doc under active review carries a little invisible plumbing. The cost is paid only where the value is received. Note the tradeoff honestly:"
            - strong [ref=f5e295]: commenting on a doc modifies the file.
            - text: For repo-backed docs that means a diff caused by a social act. Accept it, and make sure the sidecar degrades gracefully when the marker isn't there — fall back to rule 2.
          - heading [level=3] [ref=f5e296]:
            - button "Insert below" [ref=f5e297] [cursor=pointer]: +
            - text: The sidecar, and what it's keyed to
          - paragraph [ref=f5e298]:
            - button "Insert below" [ref=f5e299] [cursor=pointer]: +
            - text: The interesting question isn't
            - emphasis [ref=f5e300]: where the sidecar lives
            - text: — it's cloud, with an optional exportable form for teams who want annotations to travel. The interesting question is
            - strong [ref=f5e301]: what it points at
            - text: ", and that has a forced answer."
          - paragraph [ref=f5e302]:
            - button "Insert below" [ref=f5e303] [cursor=pointer]: +
            - text: "Keyed to a file path, renaming or moving a doc orphans every comment on it. Surviving renames requires a document identity that isn't its location. Typed frontmatter already exists in v1, so:"
          - code [ref=f5e305]:
            - button "Insert below" [ref=f5e306] [cursor=pointer]: +
            - text: "--- galley: 01J8XK2M # doc identity, survives rename and move status: draft owner: priya ---"
          - paragraph [ref=f5e307]:
            - button "Insert below" [ref=f5e308] [cursor=pointer]: +
            - text: One line, valid YAML, invisible in any renderer that shows frontmatter as metadata. It buys identity across renames, moves, and copies, and it's what a
            - code [ref=f5e309]: doc#block
            - text: reference resolves against.
          - heading [level=3] [ref=f5e310]:
            - button "Insert below" [ref=f5e311] [cursor=pointer]: +
            - text: "Filesystem events: magnitude changes the semantic"
          - paragraph [ref=f5e312]:
            - button "Insert below" [ref=f5e313] [cursor=pointer]: +
            - text: "\"No merge dialog, ever\" is the right law, and it breaks on one case. A"
            - code [ref=f5e314]: git checkout
            - text: replaces the entire file. Diffed against the projection, that's a huge inbound op set attributed to
            - code [ref=f5e315]: local filesystem
            - text: ", silently rewriting the document under everyone editing it, mid-sentence."
          - paragraph [ref=f5e316]:
            - button "Insert below" [ref=f5e317] [cursor=pointer]: +
            - text: "The refinement preserves the law rather than excepting it: a whole-file replacement isn't an edit, it's"
            - strong [ref=f5e318]: a new document version
            - text: ", and the response is a session boundary — not a dialog asking anyone to merge anything."
          - table [ref=f5e319]:
            - rowgroup [ref=f5e320]:
              - button "Insert below" [ref=f5e321] [cursor=pointer]: +
              - row [ref=f5e322]:
                - columnheader "Event" [ref=f5e323]
                - columnheader "Defined behavior" [ref=f5e324]
              - row [ref=f5e325]:
                - cell "Small external diff (below threshold)" [ref=f5e326]
                - cell [ref=f5e327]:
                  - text: Inbound ops, attributed to
                  - code [ref=f5e328]: local filesystem
              - row [ref=f5e329]:
                - cell "Whole-file replacement (branch switch, revert)" [ref=f5e330]
                - cell [ref=f5e331]:
                  - text: "End session. Standalone doc: re-ingest as a new version, offer restore from history. Repo-mapped doc: mark"
                  - strong [ref=f5e332]: diverged
                  - text: ", don't promote — local edits become suggestions against canonical"
              - row [ref=f5e333]:
                - cell "Atomic save (write temp + rename)" [ref=f5e334]
                - cell "Treat delete+create on the watched path as modify — this is what most editors actually do" [ref=f5e335]
              - row [ref=f5e336]:
                - cell "Partial / in-progress write" [ref=f5e337]
                - cell "Debounce, validate parse, never apply a half-file" [ref=f5e338]
              - row [ref=f5e339]:
                - cell "File deleted mid-session" [ref=f5e340]
                - cell "Session continues in cloud, file marked detached, one-click rewrite to disk" [ref=f5e341]
              - row [ref=f5e342]:
                - cell "File is a symlink" [ref=f5e343]
                - cell "Follow, watch the target, write through" [ref=f5e344]
              - row [ref=f5e345]:
                - cell "Offline" [ref=f5e346]
                - cell "Session continues in cloud, file reconciles on reconnect — same path, no special case" [ref=f5e347]
          - paragraph [ref=f5e348]:
            - button "Insert below" [ref=f5e349] [cursor=pointer]: +
            - text: This table is the section most likely to be under-budgeted and most likely to kill the product. It is not a polish item.
          - heading [level=3] [ref=f5e350]:
            - button "Insert below" [ref=f5e351] [cursor=pointer]: +
            - text: Suggestions
          - paragraph [ref=f5e352]:
            - button "Insert below" [ref=f5e353] [cursor=pointer]: +
            - text: A CRDT's premise is that everything merges. A suggestion is precisely an edit that must
            - emphasis [ref=f5e354]: not
            - text: merge until a human approves it. So a suggestion is
            - strong [ref=f5e355]: not
            - text: "an op on the main document — it's a proposal object in the sidecar: anchor, replacement content, author, rationale, state."
          - code [ref=f5e357]:
            - button "Insert below" [ref=f5e358] [cursor=pointer]: +
            - text: pending → accepted (becomes ops, attributed to the proposer) → rejected (retained for audit) → stale (underlying block changed since proposal)
          - paragraph [ref=f5e359]:
            - button "Insert below" [ref=f5e360] [cursor=pointer]: +
            - code [ref=f5e361]: stale
            - text: is the state everyone forgets and it's the one that matters. If the paragraph moved out from under a proposal, show the proposal, mark it stale, never auto-apply it.
          - paragraph [ref=f5e362]:
            - button "Insert below" [ref=f5e363] [cursor=pointer]: +
            - text: A suggestion is a set of
            - strong [ref=f5e364]: block-scoped ops
            - text: "— replace, insert, delete, move — not a replacement blob. That's what carries identity through an agent rewrite (see the hard questions, #3), and the CLI rejects whole-document replacement on any doc that has durable anchors."
          - paragraph [ref=f5e365]:
            - button "Insert below" [ref=f5e366] [cursor=pointer]: +
            - strong [ref=f5e367]: Agent edits are suggestions by default.
            - text: This is the trust primitive of the entire product, and it should ship this way even though direct-write demos better. Direct-write is a per-doc, per-agent permission a human grants deliberately. An agent-authored suggestion is never auto-accepted, including by a rule its sponsor wrote.
          - heading [level=3] [ref=f5e368]:
            - button "Insert below" [ref=f5e369] [cursor=pointer]: +
            - text: Comments
          - list [ref=f5e370]:
            - button "Insert below" [ref=f5e371] [cursor=pointer]: +
            - listitem [ref=f5e372]:
              - paragraph [ref=f5e373]: Anchored to a block or a span within a block.
            - listitem [ref=f5e374]:
              - paragraph [ref=f5e375]: Threaded, with open/resolved state and an assignee.
            - listitem [ref=f5e376]:
              - paragraph [ref=f5e377]:
                - strong [ref=f5e378]: Email is full-duplex.
                - text: Notification out, reply-by-email lands in-thread. Disproportionate value for the non-technical collaborators who live in their inbox.
            - listitem [ref=f5e379]:
              - paragraph [ref=f5e380]:
                - code [ref=f5e381]: "@agent"
                - text: in a thread dispatches a scoped task — the anchor plus surrounding context, never the whole doc.
            - listitem [ref=f5e382]:
              - paragraph [ref=f5e383]:
                - text: Agents get a
                - strong [ref=f5e384]: comment budget per doc per run.
                - text: An agent that leaves nineteen comments makes the document unusable. This is a hard limit, not a guideline.
          - paragraph [ref=f5e385]:
            - button "Insert below" [ref=f5e386] [cursor=pointer]: +
            - text: A comment is really a
            - strong [ref=f5e387]: work item scoped to a span of text
            - text: ", with state, an assignee, and an audit trail. That's an issue tracker living inside prose, which is the correct shape for this."
          - heading [level=3] [ref=f5e388]:
            - button "Insert below" [ref=f5e389] [cursor=pointer]: +
            - text: History
          - paragraph [ref=f5e390]:
            - button "Insert below" [ref=f5e391] [cursor=pointer]: +
            - text: "Users get: a scrubbable timeline, named checkpoints, per-block attribution (\"who wrote this sentence, when, and was it a person\"), and restore."
          - paragraph [ref=f5e392]:
            - button "Insert below" [ref=f5e393] [cursor=pointer]: +
            - text: "Users never get: commits, branches, merges, conflicts, or the word \"rebase.\""
          - paragraph [ref=f5e394]:
            - button "Insert below" [ref=f5e395] [cursor=pointer]: +
            - text: The operation log gives you all of the first list. Don't expose the second list to buy credibility with engineers — they aren't the ones who need convincing, and they already have git.
          - separator [ref=f5e396]
          - heading [level=2] [ref=f5e397]:
            - button "Insert below" [ref=f5e398] [cursor=pointer]: +
            - text: Where Markdown breaks, and the minimal fix
          - table [ref=f5e399]:
            - rowgroup [ref=f5e400]:
              - button "Insert below" [ref=f5e401] [cursor=pointer]: +
              - row [ref=f5e402]:
                - columnheader "Gap" [ref=f5e403]
                - columnheader "Why it matters" [ref=f5e404]
                - columnheader "Fix" [ref=f5e405]
              - row [ref=f5e406]:
                - cell [ref=f5e407]:
                  - strong [ref=f5e408]: No block identity
                - cell "Comments, citations, agent scoping, history all need an anchor" [ref=f5e409]
                - cell "Sidecar block map; materialized into the file only when durable" [ref=f5e410]
              - row [ref=f5e411]:
                - cell [ref=f5e412]:
                  - strong [ref=f5e413]: Frontmatter is untyped
                - cell "It's the metadata layer agents filter and route on" [ref=f5e414]
                - cell "Schema'd frontmatter, rendered as UI chips, still valid YAML" [ref=f5e415]
              - row [ref=f5e416]:
                - cell [ref=f5e417]:
                  - strong [ref=f5e418]: Tables are miserable
                - cell "Non-technical users live in tables" [ref=f5e419]
                - cell "Edit as a grid; serialize to pipe tables; overflow to a fenced block when pipe tables can't express it" [ref=f5e420]
              - row [ref=f5e421]:
                - cell [ref=f5e422]:
                  - strong [ref=f5e423]: No transclusion
                - cell "DRY docs; one definition, many places" [ref=f5e424]
                - cell [ref=f5e425]:
                  - code [ref=f5e426]: "![[doc#block]]"
                  - text: ", degrades to a link"
              - row [ref=f5e427]:
                - cell [ref=f5e428]:
                  - strong [ref=f5e429]: No callouts
                - cell "Every doc tool has them; users expect them" [ref=f5e430]
                - cell [ref=f5e431]:
                  - text: Adopt the GitHub/Obsidian
                  - code [ref=f5e432]: "> [!NOTE]"
                  - text: convention. Don't invent one.
              - row [ref=f5e433]:
                - cell [ref=f5e434]:
                  - strong [ref=f5e435]: No rich embeds
                - cell "Whatever comes later needs a door" [ref=f5e436]
                - cell "Fenced block with a type; degrades to a visible link" [ref=f5e437]
          - separator [ref=f5e438]
          - heading [level=2] [ref=f5e439]:
            - button "Insert below" [ref=f5e440] [cursor=pointer]: +
            - text: Build order
          - paragraph [ref=f5e441]:
            - button "Insert below" [ref=f5e442] [cursor=pointer]: +
            - text: Ordered by
            - strong [ref=f5e443]: uncertainty, not dependency
            - text: . Build the thing that can kill you first, because it's cheap to learn and expensive to discover late.
          - paragraph [ref=f5e444]:
            - button "Insert below" [ref=f5e445] [cursor=pointer]: +
            - strong [ref=f5e446]: 1. The splicing round-trip engine + WYSIWYG, single local file.
            - text: "No multiplayer, no comments, no agents, no email. Success condition: open a real folder of documents, edit for an hour, and"
            - code [ref=f5e447]: git diff
            - text: shows only what you typed. Weeks, not quarters. If this fails, nothing downstream matters.
          - paragraph [ref=f5e448]:
            - button "Insert below" [ref=f5e449] [cursor=pointer]: +
            - strong [ref=f5e450]: 2. Block identity + the CLI read path.
            - code [ref=f5e451]: galley pull
            - text: ","
            - code [ref=f5e452]: read
            - text: ","
            - code [ref=f5e453]: search
            - text: ", and a first-party skill. Point a coding agent at it and run Walkthrough A end to end. This is the first moment the product is"
            - emphasis [ref=f5e454]: for
            - text: something — and because the CLI is a binary over the same store the app uses, it costs days, not a quarter.
          - paragraph [ref=f5e455]:
            - button "Insert below" [ref=f5e456] [cursor=pointer]: +
            - strong [ref=f5e457]: 3. Comments + suggestions + the review UI.
            - text: "Walkthrough B. Identity has to survive an agent rewriting a commented paragraph — that's the acceptance test, and it validates every decision in the block-identity section. Gate: the anchor benchmark in CI, ≥95% survival across a corpus of real agent rewrites, zero silent misattachments."
          - paragraph [ref=f5e458]:
            - button "Insert below" [ref=f5e459] [cursor=pointer]: +
            - strong [ref=f5e460]: 4. Real-time multiplayer, presence, history UI.
            - text: Most expensive item, least uncertain. Loro works. Doing this later costs less than doing it first, because by now you know what the document model actually is.
          - paragraph [ref=f5e461]:
            - button "Insert below" [ref=f5e462] [cursor=pointer]: +
            - strong [ref=f5e463]: 5. The GitHub app, email round-trip, typed frontmatter UI, grid tables.
          - paragraph [ref=f5e464]:
            - button "Insert below" [ref=f5e465] [cursor=pointer]: +
            - text: The GitHub app is what makes a cloud-native doc reach a repo without anyone cloning it. It's a v1 commitment, but it's low-uncertainty plumbing over an already-settled model, so it sits here rather than earlier.
          - paragraph [ref=f5e466]:
            - button "Insert below" [ref=f5e467] [cursor=pointer]: +
            - text: Email is explicitly a proven mechanic — which means it teaches you nothing and can wait.
          - paragraph [ref=f5e468]:
            - button "Insert below" [ref=f5e469] [cursor=pointer]: +
            - strong [ref=f5e470]: "Cut for now:"
            - text: design canvas · agent visual feedback on rendered output · any git plumbing · a new file extension · anything that makes the file unreadable in another editor.
          - paragraph [ref=f5e471]:
            - button "Insert below" [ref=f5e472] [cursor=pointer]: +
            - text: "Keep one hook: a"
            - strong [ref=f5e473]: generic embed primitive
            - text: ", so a canvas or anything else can be dropped in later without a format change."
          - separator [ref=f5e474]
          - heading [level=2] [ref=f5e475]:
            - button "Insert below" [ref=f5e476] [cursor=pointer]: +
            - text: The hard questions, decided
          - paragraph [ref=f5e477]:
            - button "Insert below" [ref=f5e478] [cursor=pointer]: +
            - text: These were open in v0.2. Each one now has an answer, with the residual risk stated rather than hidden.
          - heading [level=3] [ref=f5e479]:
            - button "Insert below" [ref=f5e480] [cursor=pointer]: +
            - text: 1. Docs that exist on several git branches at once
          - paragraph [ref=f5e481]:
            - button "Insert below" [ref=f5e482] [cursor=pointer]: +
            - strong [ref=f5e483]: "Decision: one canonical version per doc identity. Galley never holds two versions of the same doc, and a branch variant is not a fork — it's a divergence to be reviewed."
          - paragraph [ref=f5e484]:
            - button "Insert below" [ref=f5e485] [cursor=pointer]: +
            - text: The
            - code [ref=f5e486]: "galley:"
            - text: frontmatter ULID is the identity, and it is deliberately
            - emphasis [ref=f5e487]: not
            - text: a git ref. Comments, citations, suggestions, and history attach to
            - code [ref=f5e488]: doc-identity#block
            - text: "and nothing else. When a mirrored file's content stops matching the canonical version — which is exactly what a branch switch looks like — the whole-file replacement rule from the filesystem table fires: the session ends, and the file is marked"
            - strong [ref=f5e489]: diverged
            - text: rather than ingested. A diverged file is not silently promoted into the doc; editing it produces suggestions against canonical, reviewed like any other.
          - paragraph [ref=f5e490]:
            - button "Insert below" [ref=f5e491] [cursor=pointer]: +
            - text: "The consequence to accept: a block that exists only on a feature branch has no anchor, so a comment left on it orphans into the tray. That's correct behavior — a comment on a paragraph that doesn't exist in the canonical doc has nowhere honest to live."
          - paragraph [ref=f5e492]:
            - button "Insert below" [ref=f5e493] [cursor=pointer]: +
            - text: "Why this is right rather than merely simple: docs drift across branches far less than code does, and the alternative — per-branch doc variants — splits the comment ecosystem in two, which is the one thing that makes the annotation layer worthless. Galley stays free of git vocabulary because the divergence is expressed in Galley's own primitives."
          - paragraph [ref=f5e494]:
            - button "Insert below" [ref=f5e495] [cursor=pointer]: +
            - emphasis [ref=f5e496]:
              - text: (This gets easier still if the checkout model in
              - code [ref=f5e497]: tradeoffs.md
              - text: "is taken: a branch becomes a checkout that hasn't been pushed, and the same suggestion path covers it.)"
          - heading [level=3] [ref=f5e498]:
            - button "Insert below" [ref=f5e499] [cursor=pointer]: +
            - text: 2. How a cloud-native doc reaches a repo
          - paragraph [ref=f5e500]:
            - button "Insert below" [ref=f5e501] [cursor=pointer]: +
            - strong [ref=f5e502]: "Decision: server-side. A Galley GitHub app writes to the repo on the workspace's behalf. The repo is a publishing target, not a peer of the CRDT."
          - paragraph [ref=f5e503]:
            - button "Insert below" [ref=f5e504] [cursor=pointer]: +
            - text: The workspace declares a map — doc path in Galley → path in the repo → branch — and Galley commits accepted changes itself. The default is a single long-lived PR per doc, updated in place, so review lands in the reviewer's existing workflow; teams that don't want the ceremony can configure direct commits to a designated branch. The PM who wrote the doc never clones anything.
          - paragraph [ref=f5e505]:
            - button "Insert below" [ref=f5e506] [cursor=pointer]: +
            - text: Inbound commits on a mapped path arrive as external edits attributed to
            - code [ref=f5e507]: git
            - text: ", through the same path as any other external edit. A teammate's local mirror is then just an ordinary checkout of that branch, and stops being load-bearing."
          - paragraph [ref=f5e508]:
            - button "Insert below" [ref=f5e509] [cursor=pointer]: +
            - text: "Residual risk: the app needs write scope on the repo, which is a real security conversation with any customer whose docs live next to their code. Read-only mode with export-a-patch is the fallback for teams that won't grant it."
          - heading [level=3] [ref=f5e510]:
            - button "Insert below" [ref=f5e511] [cursor=pointer]: +
            - text: 3. Anchor loss under agent rewriting
          - paragraph [ref=f5e512]:
            - button "Insert below" [ref=f5e513] [cursor=pointer]: +
            - strong [ref=f5e514]: "Decision: don't measure the risk, remove it. The CLI refuses whole-document replacement for any doc with durable anchors."
          - paragraph [ref=f5e515]:
            - button "Insert below" [ref=f5e516] [cursor=pointer]: +
            - code [ref=f5e517]: galley suggest
            - text: takes block-scoped operations — replace, insert, delete, move — each carrying identity. "Rewrite this whole section" is expressed as a sequence of those, not as a new blob of text, so identity flows through by construction rather than by fuzzy matching after the fact. Anchor loss becomes possible only where an agent explicitly deletes a block, which is semantically the right place to lose one. The skill teaches the etiquette; the CLI enforces the shape, because etiquette that isn't enforced is a suggestion to a model.
          - paragraph [ref=f5e518]:
            - button "Insert below" [ref=f5e519] [cursor=pointer]: +
            - text: "This still needs a number, so it becomes an acceptance gate rather than an unknown: a benchmark corpus of real agent rewrites over commented docs, run in CI, gating build step 3."
            - strong [ref=f5e520]: ≥95% anchor survival, zero silent misattachments.
            - text: A misattachment is a bug of a different class than an orphan and is never traded off against the survival rate.
          - heading [level=3] [ref=f5e521]:
            - button "Insert below" [ref=f5e522] [cursor=pointer]: +
            - text: 4. An agent acting for an absent human
          - paragraph [ref=f5e523]:
            - button "Insert below" [ref=f5e524] [cursor=pointer]: +
            - strong [ref=f5e525]: "Decision: an agent is a first-class principal with its own identity. Never impersonation."
          - paragraph [ref=f5e526]:
            - button "Insert below" [ref=f5e527] [cursor=pointer]: +
            - code [ref=f5e528]: galley auth login
            - text: issues a token to an
            - emphasis [ref=f5e529]: (agent, sponsor)
            - text: pair. The agent's permissions are the intersection of the sponsor's grants and the token's declared scope — always a subset, never equal to the human's. The audit trail records both, and reads as
            - code [ref=f5e530]: galley-bot/ci, sponsored by priya
            - text: . The agent is the actor; the sponsor is accountable for the grant.
          - paragraph [ref=f5e531]:
            - button "Insert below" [ref=f5e532] [cursor=pointer]: +
            - text: "What follows:"
          - list [ref=f5e533]:
            - button "Insert below" [ref=f5e534] [cursor=pointer]: +
            - listitem [ref=f5e535]:
              - paragraph [ref=f5e536]: Revoking a human's access revokes every token they sponsor. No orphaned 3am agents.
            - listitem [ref=f5e537]:
              - paragraph [ref=f5e538]: Agents cannot sponsor agents. Delegation chains terminate at a person.
            - listitem [ref=f5e539]:
              - paragraph [ref=f5e540]: "A suggestion authored by an agent is never auto-accepted, including by rules the sponsor wrote. Suggestion-by-default is what makes an absent sponsor a non-problem: nothing lands while they're asleep."
          - heading [level=3] [ref=f5e541]:
            - button "Insert below" [ref=f5e542] [cursor=pointer]: +
            - text: 5. Desktop app or File System Access API
          - paragraph [ref=f5e543]:
            - button "Insert below" [ref=f5e544] [cursor=pointer]: +
            - strong [ref=f5e545]: "Decision: neither is the mechanism. The CLI is the local mirror."
          - paragraph [ref=f5e546]:
            - button "Insert below" [ref=f5e547] [cursor=pointer]: +
            - code [ref=f5e548]: galley pull
            - text: "is already a binary that puts files on disk, and it's the surface agents use anyway — shipping a desktop app to do the same job buys no capability and costs a distribution channel, code-signing, and an update story. The File System Access API ships as a convenience for the browser-only user who wants a folder open, with its limits stated plainly: Chromium-only, per-session permission prompts, no background watching. If a user needs the mirror to be reliable, they install the CLI."
          - heading [level=3] [ref=f5e549]:
            - button "Insert below" [ref=f5e550] [cursor=pointer]: +
            - text: 6. Does a doc have an owner, or does a workspace?
          - paragraph [ref=f5e551]:
            - button "Insert below" [ref=f5e552] [cursor=pointer]: +
            - strong [ref=f5e553]: "Decision: both, doing different jobs — and only one of them is a permission."
          - paragraph [ref=f5e554]:
            - button "Insert below" [ref=f5e555] [cursor=pointer]: +
            - text: The
            - strong [ref=f5e556]: workspace
            - text: "owns access: membership, permissions, billing. Permissions never come from a doc-level field, which is what keeps this out of per-doc ACL territory."
          - paragraph [ref=f5e557]:
            - button "Insert below" [ref=f5e558] [cursor=pointer]: +
            - text: The
            - strong [ref=f5e559]: doc
            - text: has an
            - code [ref=f5e560]: "owner:"
            - text: "— an accountability field, a person, defaulting to the creator and freely reassignable. It routes the things that need a human: the staleness nudge (\"this doc feeds three agents and hasn't been touched in 90 days\"), suggestions nobody has reviewed, and orphaned anchors waiting in the tray. An unowned doc is a doc whose staleness is nobody's problem, which is how docs rot."
          - separator [ref=f5e561]
          - heading [level=3] [ref=f5e562]:
            - button "Insert below" [ref=f5e563] [cursor=pointer]: +
            - text: Still genuinely unknown
          - paragraph [ref=f5e564]:
            - button "Insert below" [ref=f5e565] [cursor=pointer]: +
            - text: Not open problems in the above sense — things that only measurement answers.
          - list [ref=f5e566]:
            - button "Insert below" [ref=f5e567] [cursor=pointer]: +
            - listitem [ref=f5e568]:
              - paragraph [ref=f5e569]:
                - text: "Whether the ≥95% anchor-survival gate in #3 is achievable at the first attempt, or whether the block-op vocabulary needs a"
                - code [ref=f5e570]: move
                - text: semantic richer than the obvious one.
            - listitem [ref=f5e571]:
              - paragraph [ref=f5e572]: Whether teams will grant repo write scope (#2) often enough that the server-side path is the main one, or whether read-only-plus-patch becomes the default in practice.
          - separator [ref=f5e573]
          - heading [level=2] [ref=f5e574]:
            - button "Insert below" [ref=f5e575] [cursor=pointer]: +
            - text: What will actually kill this
          - list [ref=f5e576]:
            - button "Insert below" [ref=f5e577] [cursor=pointer]: +
            - listitem [ref=f5e578]:
              - paragraph [ref=f5e579]:
                - strong [ref=f5e580]: Round-trip fidelity.
                - text: Covered above. If someone's
                - code [ref=f5e581]: git diff
                - text: shows noise they didn't create, the credibility is gone permanently and you don't get it back.
            - listitem [ref=f5e582]:
              - paragraph [ref=f5e583]:
                - strong [ref=f5e584]: Filesystem edge cases.
                - text: The table above, plus the ones not in it yet. Budget more than feels reasonable.
            - listitem [ref=f5e585]:
              - paragraph [ref=f5e586]:
                - strong [ref=f5e587]: Agent slop.
                - text: Nineteen comments, or a suggestion that rewrites a document into confident mush. Budgets, scoping, and suggestion-by-default are the defenses, and they have to be defaults rather than settings.
            - listitem [ref=f5e588]:
              - paragraph [ref=f5e589]:
                - strong [ref=f5e590]: Positioning drift.
