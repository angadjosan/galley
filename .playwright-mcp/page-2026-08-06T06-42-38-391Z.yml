    - generic [ref=f55e159]:
      - main [ref=f55e160]:
        - generic "Document" [ref=f55e163]:
          - paragraph [ref=f55e164]:
            - link "▧ Form" [ref=f55e165]:
              - /url: design/galley-design-crqt
          - heading "Galley" [level=1] [ref=f55e166]
          - paragraph [ref=f55e167]:
            - strong [ref=f55e168]: Design doc, v0.3
          - paragraph [ref=f55e169]: A galley proof is the draft you circulate before publication — the version that exists to be marked up. That's the product.
          - paragraph [ref=f55e170]: Things I want to fix
          - list [ref=f55e171]:
            - listitem [ref=f55e172]:
              - paragraph [ref=f55e173]: auth
            - listitem [ref=f55e174]:
              - paragraph [ref=f55e175]: no slash commands - make all commands google docs style. you can't tell its markdown. that's the goal. Notion is confusing because it's intimidating and too minimal. Google Docs is way better.
            - listitem [ref=f55e176]:
              - paragraph [ref=f55e177]: clean up rough edges
            - listitem [ref=f55e178]:
              - paragraph [ref=f55e179]: test multiplayer, agents, etc
            - listitem [ref=f55e180]:
              - paragraph [ref=f55e181]: read the code
            - listitem [ref=f55e182]:
              - paragraph [ref=f55e183]: Add native mermaid/imaging support (openCV). Maybe make own native design editor, put live design references right into docs.
          - separator [ref=f55e184]
          - heading "The one sentence" [level=2] [ref=f55e185]
          - separator [ref=f55e186]
          - heading "The thesis" [level=2] [ref=f55e187]
          - paragraph [ref=f55e188]: "Every document written today has a second audience nobody designed for: a model."
          - paragraph [ref=f55e189]:
            - text: Specs get pasted into coding agents. Policies get scraped into retrieval pipelines. Runbooks get handed to an assistant that's supposed to follow them. The doc is no longer a thing a person reads once — it's
            - strong [ref=f55e190]: context
            - text: ", consumed repeatedly by machines, and every tool people currently write in is hostile to that."
          - paragraph [ref=f55e191]:
            - text: Notion exports mangled Markdown and hides the good stuff behind an API you have to crawl. Google Docs is a rendering format pretending to be a storage format. Confluence is a database with a WYSIWYG on top. In all three, getting a document
            - emphasis [ref=f55e192]: out
            - text: in a form a model can use is a lossy export job, and there is no way for a model to point back at the paragraph it used.
          - paragraph [ref=f55e193]:
            - text: The people writing these documents are not engineers. They are PMs, designers, support leads, ops, founders, technical writers, marketers. They will never type
            - code [ref=f55e194]: "**bold**"
            - text: and they should never have to.
          - blockquote [ref=f55e195]:
            - paragraph [ref=f55e196]:
              - strong [ref=f55e197]: A document has two audiences. Write for the human, store for the machine.
          - paragraph [ref=f55e198]: That's the product. Not "Markdown for normies." Not "docs in git." A writing surface where the thing that comes out the other end is already the thing your agents need.
          - separator [ref=f55e199]
          - heading "Why anyone uses this" [level=2] [ref=f55e200]
          - paragraph [ref=f55e201]: "Concretely, in order of how often it will be the reason:"
          - list [ref=f55e202]:
            - listitem [ref=f55e203]:
              - paragraph [ref=f55e204]:
                - strong [ref=f55e205]: What you paste into an agent is correct.
                - text: No export step, no mangled tables, no lost structure. The doc
                - emphasis [ref=f55e206]: is
                - text: the context.
            - listitem [ref=f55e207]:
              - paragraph [ref=f55e208]:
                - strong [ref=f55e209]: Agents can cite you back.
                - text: An answer says "per §Refunds/¶3" and that resolves to a real block you can click. Retrieval stops being a black box.
            - listitem [ref=f55e210]:
              - paragraph [ref=f55e211]:
                - strong [ref=f55e212]: An agent can propose an edit and you can review it like a person's edit.
                - text: Not a chat window that regenerates your document — a suggestion on a paragraph, with a diff, that you accept or reject.
            - listitem [ref=f55e213]:
              - paragraph [ref=f55e214]:
                - strong [ref=f55e215]: Stale docs get caught.
                - text: A doc that feeds agents is worse than useless when it's wrong — it launders bad information into confident answers. Blocks know when they were last touched and by whom, and what's reading them.
            - listitem [ref=f55e216]:
              - paragraph [ref=f55e217]:
                - strong [ref=f55e218]: It opens anywhere, forever.
                - text: The file is CommonMark. No proprietary format, no export hostage situation.
          - paragraph [ref=f55e219]:
            - text: Note what's
            - emphasis [ref=f55e220]: not
            - text: "on that list: real-time multiplayer. It's table stakes, it has to work, and it is not why anyone switches."
          - separator [ref=f55e221]
          - heading "Two walkthroughs" [level=2] [ref=f55e222]
          - paragraph [ref=f55e223]: The architecture below only makes sense against these. If a decision doesn't serve one of them, it's out of scope.
          - heading "A. Human writes, agent consumes" [level=3] [ref=f55e224]
          - paragraph [ref=f55e225]:
            - text: Priya is a PM. She writes a spec in Galley — bold text, headings, a table of API fields, a callout for the open question. She never sees a
            - code [ref=f55e226]: "#"
            - text: or a
            - code [ref=f55e227]: "|"
            - text: .
          - paragraph [ref=f55e228]:
            - text: She finishes and hands it to a coding agent. Not by copy-paste — she says "implement the spec at
            - code [ref=f55e229]: specs/checkout-v2
            - text: ",\" and the agent runs"
            - code [ref=f55e230]: galley read specs/checkout-v2
            - text: ". It gets Markdown on stdout: the same bytes that are on disk, no conversion, the table as a table, the callout as a callout, and a stable ID on every block."
          - paragraph [ref=f55e231]:
            - text: "The agent implements it, and comes back with: \"§API Fields/¶2 says"
            - code [ref=f55e232]: currency
            - text: is optional but §Validation/¶1 requires it. Which?" That's a comment thread anchored to both blocks. Priya answers in the thread, in prose, in her inbox.
          - heading "B. Agent writes, human reviews" [level=3] [ref=f55e233]
          - paragraph [ref=f55e234]: "The same spec, three weeks later. The implementation drifted. A coding agent that touched the code notices the doc no longer matches and proposes an edit: two paragraphs rewritten, one table row changed."
          - paragraph [ref=f55e235]:
            - text: It lands as a
            - strong [ref=f55e236]: suggestion
            - text: — highlighted, attributed, diffable, scoped to exactly those blocks. Priya accepts one, rejects one, edits the third herself. The comment thread she had on one of those paragraphs is still attached afterward, because the paragraph kept its identity through the rewrite.
          - paragraph [ref=f55e237]: Everything hard in this document is downstream of that last sentence.
          - separator [ref=f55e238]
          - heading "Principles" [level=2] [ref=f55e239]
          - paragraph [ref=f55e240]:
            - strong [ref=f55e241]: I. Markdown is the format, not the interface.
            - text: WYSIWYG always. Source view is a toggle for people who want it, never a mode anyone is dropped into. Get this wrong and you've built HackMD with a nicer logo.
          - paragraph [ref=f55e242]:
            - strong [ref=f55e243]: II. Every block has a stable identity.
            - text: This is the technical thesis. Block identity is what makes comments, agent scoping, citation, transclusion, attribution, and staleness all work — six features that are secretly one feature. It's also the one real gap in Markdown.
          - paragraph [ref=f55e244]:
            - strong [ref=f55e245]: III. Humans and agents share one model.
            - text: "An agent is a cursor, an author, a commenter, and a permission subject — not a chat sidebar bolted onto the side. The reason this matters isn't philosophical: it's"
            - strong [ref=f55e246]: scoping
            - text: . An agent mentioned in a thread gets one anchored paragraph and its surroundings, not 40kb of document. Precision in, precision out.
          - paragraph [ref=f55e247]:
            - strong [ref=f55e248]: IV. Every extension degrades to valid CommonMark.
            - text: The temptation is to invent a richer format. Resist it — that's how you get a walled garden and lose "opens anywhere," which is half the value.
          - separator [ref=f55e249]
          - heading "What agents actually need, and what to build for it" [level=2] [ref=f55e250]
          - paragraph [ref=f55e251]: "Being \"agent-native\" is four concrete capabilities, not a vibe:"
          - table [ref=f55e252]:
            - rowgroup [ref=f55e253]:
              - row [ref=f55e254]:
                - columnheader "Capability" [ref=f55e255]
                - columnheader "What to build" [ref=f55e256]
              - row [ref=f55e257]:
                - cell [ref=f55e258]:
                  - strong [ref=f55e259]: Read
                  - text: a doc as clean Markdown, no export step
                - cell [ref=f55e260]:
                  - text: The file on disk
                  - emphasis [ref=f55e261]: is
                  - text: the payload. Same bytes.
              - row [ref=f55e262]:
                - cell [ref=f55e263]:
                  - strong [ref=f55e264]: Address
                  - text: a specific block, stably, across edits
                - cell "Block IDs, durable through rewrites (see below)" [ref=f55e265]
              - row [ref=f55e266]:
                - cell [ref=f55e267]:
                  - strong [ref=f55e268]: Cite
                  - text: back in a way a human can verify
                - cell [ref=f55e269]:
                  - code [ref=f55e270]: doc#block
                  - text: resolves to a scroll-and-highlight in the app
              - row [ref=f55e271]:
                - cell [ref=f55e272]:
                  - strong [ref=f55e273]: Propose
                  - text: an edit that a human reviews
                - cell "Suggestions as first-class objects, not direct writes" [ref=f55e274]
          - heading "The interface is a CLI, plus skills" [level=3] [ref=f55e275]
          - paragraph [ref=f55e276]: Not a server. Agents already have a shell — that's the one capability every harness has in common, and it's the only integration surface that costs nothing to adopt.
          - code [ref=f55e278]: "galley pull ./docs # mirror a workspace to disk galley read specs/checkout-v2 # clean Markdown on stdout galley read specs/checkout-v2#a1b2c3 # one block galley search \"refund policy\" # matching blocks, as doc#block refs galley comment <ref> \"...\" # anchored comment galley suggest <ref> --from patch.md # propose an edit (block-scoped ops) galley status # what changed, what's stale, what's pending"
          - paragraph [ref=f55e279]: "Two things follow from this that a server surface doesn't give you:"
          - paragraph [ref=f55e280]:
            - strong [ref=f55e281]:
              - code [ref=f55e282]: galley pull
              - text: means the best agent interface is no interface.
            - text: "Mirror the workspace and the docs are just files in a folder. Every coding agent already knows how to read files — no tool definition, no connector, no protocol. The CLI is for the operations a filesystem can't express: addressing a block, searching semantically, posting a comment, proposing an edit."
          - paragraph [ref=f55e283]:
            - strong [ref=f55e284]: Stdout composes.
            - code [ref=f55e285]: galley read spec | claude -p "implement this"
            - text: is a real workflow. So is a CI job that runs
            - code [ref=f55e286]: galley status --stale
            - text: and fails when a doc that feeds production agents has drifted from the code. Long-lived connections can't do that; a binary can.
          - paragraph [ref=f55e287]:
            - strong [ref=f55e288]: Skills carry the etiquette that the CLI can't enforce.
            - text: The CLI gives an agent
            - emphasis [ref=f55e289]: capability
            - text: ; a Galley skill gives it
            - emphasis [ref=f55e290]: behavior
            - text: — the citation convention, the comment budget, suggestion-before-write, how to scope a rewrite so block identity survives. Skills are files, so they version with the workspace and travel to whatever harness the user runs. Ship a first-party one, let teams fork it.
          - paragraph [ref=f55e291]:
            - strong [ref=f55e292]: Permissions.
            - code [ref=f55e293]: galley auth login
            - text: issues a scoped token to an
            - emphasis [ref=f55e294]: (agent, human sponsor)
            - text: "pair — the agent is its own principal, never an impersonation of the sponsor, and its grants are always a subset of theirs. An agent's permissions are otherwise the same object as a human's: read"
            - code [ref=f55e295]: /policies
            - text: ", suggest on"
            - code [ref=f55e296]: /specs
            - text: ", write nowhere is a normal thing to express. Every command is auditable and replayable, which a persistent session is not."
          - paragraph [ref=f55e297]:
            - text: "The honest cost: a CLI can't push. An agent can't be"
            - emphasis [ref=f55e298]: notified
            - text: that someone replied to its comment — it has to be run again and poll
            - code [ref=f55e299]: galley status
            - text: . For the workflows above that's fine, and if a subscription surface is ever needed it can wrap the same commands.
          - separator [ref=f55e300]
          - heading "Architecture" [level=2] [ref=f55e301]
          - heading "The sync engine" [level=3] [ref=f55e302]
          - code [ref=f55e304]: local file ←────── projection writer (splicing) (clean .md) ──────→ fs watcher ──┐ ↓ ┌────────────────┐ browser session ←────────→│ CRDT (doc) │ agent via CLI ←────────→│ authoritative │ mobile ←────────→└────────────────┘ ↓ sidecar store (block map, comments, suggestions, history, presence)
          - paragraph [ref=f55e305]: "Two modes, one code path:"
          - list [ref=f55e306]:
            - listitem [ref=f55e307]:
              - paragraph [ref=f55e308]:
                - strong [ref=f55e309]: Cloud-native
                - text: — no local file. The doc lives in the CRDT store. This is the default and it's where most users live.
            - listitem [ref=f55e310]:
              - paragraph [ref=f55e311]:
                - strong [ref=f55e312]: Local mirror
                - text: — you point Galley at a file or folder on disk, typically because that's where your coding agents read from. Session opens, file is ingested, CRDT becomes authoritative, the projection writer keeps the file current in real time.
          - blockquote [ref=f55e313]:
            - paragraph [ref=f55e314]:
              - strong [ref=f55e315]: "Law: during a session, the CRDT is the source of truth. The local file is a continuously-written projection of it."
          - paragraph [ref=f55e316]:
            - text: External edits to the file are
            - emphasis [ref=f55e317]: inbound operations
            - text: ", not a competing version — diffed against the projection and applied as ops attributed to"
            - code [ref=f55e318]: local filesystem
            - text: . No merge dialog, ever.
          - paragraph [ref=f55e319]:
            - text: Build on
            - strong [ref=f55e320]: Loro
            - text: "rather than Yjs. This isn't a coin flip: two v1 requirements decide it. History-as-UX needs cheap version checkout, and suggestion review benefits from real branching. Yjs makes both into custom work. (Writing your own CRDT is a two-year detour that adds nothing a user can see.)"
          - 'heading "The projection writer: splice, don''t re-serialize" [level=3] [ref=f55e321]'
          - paragraph [ref=f55e322]:
            - text: "The failure mode that kills editors in this category: you open a file, save it, and it silently reformats. Markdown is not a canonical serialization —"
            - code [ref=f55e323]: "*"
            - text: vs
            - code [ref=f55e324]: "-"
            - text: bullets,
            - code [ref=f55e325]: _em_
            - text: vs
            - code [ref=f55e326]: "*em*"
            - text: ", ATX vs setext headings, nested-list indent width, two-space hard breaks, table pipe padding, escaping rules. Many ASTs produce the same text; many texts produce the same AST. Any AST→text serializer will reformat every file that wasn't already in its canonical style."
          - paragraph [ref=f55e327]:
            - text: So don't serialize the document.
            - strong [ref=f55e328]: Keep source ranges per node, re-emit only the nodes that changed, and leave every untouched byte literally untouched.
          - paragraph [ref=f55e329]: "And say the honest part out loud rather than letting users find it in a diff:"
          - blockquote [ref=f55e330]:
            - paragraph [ref=f55e331]:
              - strong [ref=f55e332]: First ingest normalizes, once, as a visible and explicit act. Every save after that is byte-stable.
          - paragraph [ref=f55e333]: Normalization is a thing the user agrees to when they connect a file, not a bug they discover later. After it, editing one paragraph produces a one-paragraph diff. This is a P0 architectural commitment with a P0 test suite behind it — round-trip a large corpus of real-world Markdown, assert byte equality on no-op open/save.
          - heading "Block identity" [level=3] [ref=f55e334]
          - paragraph [ref=f55e335]: "The mechanism, in priority order — the ordering is the whole point:"
          - list [ref=f55e336]:
            - listitem [ref=f55e337]:
              - paragraph [ref=f55e338]:
                - strong [ref=f55e339]: IDs are authoritative in the CRDT.
                - text: Any edit made through Galley — by a human, or by an agent through the CLI — carries block identity through the edit, because the editor knows which paragraph it is
                - emphasis [ref=f55e340]: while
                - text: it rewrites it. This is the path that must survive Walkthrough B.
            - listitem [ref=f55e341]:
              - paragraph [ref=f55e342]:
                - strong [ref=f55e343]: Fuzzy re-anchoring is the fallback
                - text: ", used only for edits that arrive through the filesystem, where identity was never in the payload. Content-similarity plus structural position, with an explicit confidence threshold."
            - listitem [ref=f55e344]:
              - paragraph [ref=f55e345]:
                - strong [ref=f55e346]: Below threshold, the anchor is orphaned, not guessed.
                - text: Orphaned comments surface in a per-doc tray with their last-known text, reattachable in one click. Silently reattaching a comment to the wrong paragraph is worse than losing it.
          - paragraph [ref=f55e347]:
            - text: Content hashing alone is not sufficient and shouldn't be the primary key — two identical
            - code [ref=f55e348]: "## Setup"
            - text: headings or two short identical paragraphs collide by construction.
          - paragraph [ref=f55e349]:
            - strong [ref=f55e350]: Materialization.
            - text: IDs live in the sidecar. Only when a block acquires something durable — a comment thread, an inbound citation, an agent task — is the ID written into the file as an HTML comment (
            - code [ref=f55e351]: <!-- ^a1b2c3 -->
            - text: ), invisible in every CommonMark renderer.
          - paragraph [ref=f55e352]:
            - text: "A doc nobody has annotated is byte-for-byte clean Markdown. A doc under active review carries a little invisible plumbing. The cost is paid only where the value is received. Note the tradeoff honestly:"
            - strong [ref=f55e353]: commenting on a doc modifies the file.
            - text: For repo-backed docs that means a diff caused by a social act. Accept it, and make sure the sidecar degrades gracefully when the marker isn't there — fall back to rule 2.
          - heading "The sidecar, and what it's keyed to" [level=3] [ref=f55e354]
          - paragraph [ref=f55e355]:
            - text: The interesting question isn't
            - emphasis [ref=f55e356]: where the sidecar lives
            - text: — it's cloud, with an optional exportable form for teams who want annotations to travel. The interesting question is
            - strong [ref=f55e357]: what it points at
            - text: ", and that has a forced answer."
          - paragraph [ref=f55e358]: "Keyed to a file path, renaming or moving a doc orphans every comment on it. Surviving renames requires a document identity that isn't its location. Typed frontmatter already exists in v1, so:"
          - code [ref=f55e360]: "--- galley: 01J8XK2M # doc identity, survives rename and move status: draft owner: priya ---"
          - paragraph [ref=f55e361]:
            - text: One line, valid YAML, invisible in any renderer that shows frontmatter as metadata. It buys identity across renames, moves, and copies, and it's what a
            - code [ref=f55e362]: doc#block
            - text: reference resolves against.
          - 'heading "Filesystem events: magnitude changes the semantic" [level=3] [ref=f55e363]'
          - paragraph [ref=f55e364]:
            - text: "\"No merge dialog, ever\" is the right law, and it breaks on one case. A"
            - code [ref=f55e365]: git checkout
            - text: replaces the entire file. Diffed against the projection, that's a huge inbound op set attributed to
            - code [ref=f55e366]: local filesystem
            - text: ", silently rewriting the document under everyone editing it, mid-sentence."
          - paragraph [ref=f55e367]:
            - text: "The refinement preserves the law rather than excepting it: a whole-file replacement isn't an edit, it's"
            - strong [ref=f55e368]: a new document version
            - text: ", and the response is a session boundary — not a dialog asking anyone to merge anything."
          - table [ref=f55e369]:
            - rowgroup [ref=f55e370]:
              - row [ref=f55e371]:
                - columnheader "Event" [ref=f55e372]
                - columnheader "Defined behavior" [ref=f55e373]
              - row [ref=f55e374]:
                - cell "Small external diff (below threshold)" [ref=f55e375]
                - cell [ref=f55e376]:
                  - text: Inbound ops, attributed to
                  - code [ref=f55e377]: local filesystem
              - row [ref=f55e378]:
                - cell "Whole-file replacement (branch switch, revert)" [ref=f55e379]
                - cell [ref=f55e380]:
                  - text: "End session. Standalone doc: re-ingest as a new version, offer restore from history. Repo-mapped doc: mark"
                  - strong [ref=f55e381]: diverged
                  - text: ", don't promote — local edits become suggestions against canonical"
              - row [ref=f55e382]:
                - cell "Atomic save (write temp + rename)" [ref=f55e383]
                - cell "Treat delete+create on the watched path as modify — this is what most editors actually do" [ref=f55e384]
              - row [ref=f55e385]:
                - cell "Partial / in-progress write" [ref=f55e386]
                - cell "Debounce, validate parse, never apply a half-file" [ref=f55e387]
              - row [ref=f55e388]:
                - cell "File deleted mid-session" [ref=f55e389]
                - cell "Session continues in cloud, file marked detached, one-click rewrite to disk" [ref=f55e390]
              - row [ref=f55e391]:
                - cell "File is a symlink" [ref=f55e392]
                - cell "Follow, watch the target, write through" [ref=f55e393]
              - row [ref=f55e394]:
                - cell "Offline" [ref=f55e395]
                - cell "Session continues in cloud, file reconciles on reconnect — same path, no special case" [ref=f55e396]
          - paragraph [ref=f55e397]: This table is the section most likely to be under-budgeted and most likely to kill the product. It is not a polish item.
          - heading "Suggestions" [level=3] [ref=f55e398]
          - paragraph [ref=f55e399]:
            - text: A CRDT's premise is that everything merges. A suggestion is precisely an edit that must
            - emphasis [ref=f55e400]: not
            - text: merge until a human approves it. So a suggestion is
            - strong [ref=f55e401]: not
            - text: "an op on the main document — it's a proposal object in the sidecar: anchor, replacement content, author, rationale, state."
          - code [ref=f55e403]: pending → accepted (becomes ops, attributed to the proposer) → rejected (retained for audit) → stale (underlying block changed since proposal)
          - paragraph [ref=f55e404]:
            - code [ref=f55e405]: stale
            - text: is the state everyone forgets and it's the one that matters. If the paragraph moved out from under a proposal, show the proposal, mark it stale, never auto-apply it.
          - paragraph [ref=f55e406]:
            - text: A suggestion is a set of
            - strong [ref=f55e407]: block-scoped ops
            - text: "— replace, insert, delete, move — not a replacement blob. That's what carries identity through an agent rewrite (see the hard questions, #3), and the CLI rejects whole-document replacement on any doc that has durable anchors."
          - paragraph [ref=f55e408]:
            - strong [ref=f55e409]: Agent edits are suggestions by default.
            - text: This is the trust primitive of the entire product, and it should ship this way even though direct-write demos better. Direct-write is a per-doc, per-agent permission a human grants deliberately. An agent-authored suggestion is never auto-accepted, including by a rule its sponsor wrote.
          - heading "Comments" [level=3] [ref=f55e410]
          - list [ref=f55e411]:
            - listitem [ref=f55e412]:
              - paragraph [ref=f55e413]: Anchored to a block or a span within a block.
            - listitem [ref=f55e414]:
              - paragraph [ref=f55e415]: Threaded, with open/resolved state and an assignee.
            - listitem [ref=f55e416]:
              - paragraph [ref=f55e417]:
                - strong [ref=f55e418]: Email is full-duplex.
                - text: Notification out, reply-by-email lands in-thread. Disproportionate value for the non-technical collaborators who live in their inbox.
            - listitem [ref=f55e419]:
              - paragraph [ref=f55e420]:
                - code [ref=f55e421]: "@agent"
                - text: in a thread dispatches a scoped task — the anchor plus surrounding context, never the whole doc.
            - listitem [ref=f55e422]:
              - paragraph [ref=f55e423]:
                - text: Agents get a
                - strong [ref=f55e424]: comment budget per doc per run.
                - text: An agent that leaves nineteen comments makes the document unusable. This is a hard limit, not a guideline.
          - paragraph [ref=f55e425]:
            - text: A comment is really a
            - strong [ref=f55e426]: work item scoped to a span of text
            - text: ", with state, an assignee, and an audit trail. That's an issue tracker living inside prose, which is the correct shape for this."
          - heading "History" [level=3] [ref=f55e427]
          - paragraph [ref=f55e428]: "Users get: a scrubbable timeline, named checkpoints, per-block attribution (\"who wrote this sentence, when, and was it a person\"), and restore."
          - paragraph [ref=f55e429]: "Users never get: commits, branches, merges, conflicts, or the word \"rebase.\""
          - paragraph [ref=f55e430]: The operation log gives you all of the first list. Don't expose the second list to buy credibility with engineers — they aren't the ones who need convincing, and they already have git.
          - separator [ref=f55e431]
          - heading "Where Markdown breaks, and the minimal fix" [level=2] [ref=f55e432]
          - table [ref=f55e433]:
            - rowgroup [ref=f55e434]:
              - row [ref=f55e435]:
                - columnheader "Gap" [ref=f55e436]
                - columnheader "Why it matters" [ref=f55e437]
                - columnheader "Fix" [ref=f55e438]
              - row [ref=f55e439]:
                - cell [ref=f55e440]:
                  - strong [ref=f55e441]: No block identity
                - cell "Comments, citations, agent scoping, history all need an anchor" [ref=f55e442]
                - cell "Sidecar block map; materialized into the file only when durable" [ref=f55e443]
              - row [ref=f55e444]:
                - cell [ref=f55e445]:
                  - strong [ref=f55e446]: Frontmatter is untyped
                - cell "It's the metadata layer agents filter and route on" [ref=f55e447]
                - cell "Schema'd frontmatter, rendered as UI chips, still valid YAML" [ref=f55e448]
              - row [ref=f55e449]:
                - cell [ref=f55e450]:
                  - strong [ref=f55e451]: Tables are miserable
                - cell "Non-technical users live in tables" [ref=f55e452]
                - cell "Edit as a grid; serialize to pipe tables; overflow to a fenced block when pipe tables can't express it" [ref=f55e453]
              - row [ref=f55e454]:
                - cell [ref=f55e455]:
                  - strong [ref=f55e456]: No transclusion
                - cell "DRY docs; one definition, many places" [ref=f55e457]
                - cell [ref=f55e458]:
                  - code [ref=f55e459]: "![[doc#block]]"
                  - text: ", degrades to a link"
              - row [ref=f55e460]:
                - cell [ref=f55e461]:
                  - strong [ref=f55e462]: No callouts
                - cell "Every doc tool has them; users expect them" [ref=f55e463]
                - cell [ref=f55e464]:
                  - text: Adopt the GitHub/Obsidian
                  - code [ref=f55e465]: "> [!NOTE]"
                  - text: convention. Don't invent one.
              - row [ref=f55e466]:
                - cell [ref=f55e467]:
                  - strong [ref=f55e468]: No rich embeds
                - cell "Whatever comes later needs a door" [ref=f55e469]
                - cell "Fenced block with a type; degrades to a visible link" [ref=f55e470]
          - separator [ref=f55e471]
          - heading "Build order" [level=2] [ref=f55e472]
          - paragraph [ref=f55e473]:
            - text: Ordered by
            - strong [ref=f55e474]: uncertainty, not dependency
            - text: . Build the thing that can kill you first, because it's cheap to learn and expensive to discover late.
          - paragraph [ref=f55e475]:
            - strong [ref=f55e476]: 1. The splicing round-trip engine + WYSIWYG, single local file.
            - text: "No multiplayer, no comments, no agents, no email. Success condition: open a real folder of documents, edit for an hour, and"
            - code [ref=f55e477]: git diff
            - text: shows only what you typed. Weeks, not quarters. If this fails, nothing downstream matters.
          - paragraph [ref=f55e478]:
            - strong [ref=f55e479]: 2. Block identity + the CLI read path.
            - code [ref=f55e480]: galley pull
            - text: ","
            - code [ref=f55e481]: read
            - text: ","
            - code [ref=f55e482]: search
            - text: ", and a first-party skill. Point a coding agent at it and run Walkthrough A end to end. This is the first moment the product is"
            - emphasis [ref=f55e483]: for
            - text: something — and because the CLI is a binary over the same store the app uses, it costs days, not a quarter.
          - paragraph [ref=f55e484]:
            - strong [ref=f55e485]: 3. Comments + suggestions + the review UI.
            - text: "Walkthrough B. Identity has to survive an agent rewriting a commented paragraph — that's the acceptance test, and it validates every decision in the block-identity section. Gate: the anchor benchmark in CI, ≥95% survival across a corpus of real agent rewrites, zero silent misattachments."
          - paragraph [ref=f55e486]:
            - strong [ref=f55e487]: 4. Real-time multiplayer, presence, history UI.
            - text: Most expensive item, least uncertain. Loro works. Doing this later costs less than doing it first, because by now you know what the document model actually is.
          - paragraph [ref=f55e488]:
            - strong [ref=f55e489]: 5. The GitHub app, email round-trip, typed frontmatter UI, grid tables.
          - paragraph [ref=f55e490]: The GitHub app is what makes a cloud-native doc reach a repo without anyone cloning it. It's a v1 commitment, but it's low-uncertainty plumbing over an already-settled model, so it sits here rather than earlier.
          - paragraph [ref=f55e491]: Email is explicitly a proven mechanic — which means it teaches you nothing and can wait.
          - paragraph [ref=f55e492]:
            - strong [ref=f55e493]: "Cut for now:"
            - text: design canvas · agent visual feedback on rendered output · any git plumbing · a new file extension · anything that makes the file unreadable in another editor.
          - paragraph [ref=f55e494]:
            - text: "Keep one hook: a"
            - strong [ref=f55e495]: generic embed primitive
            - text: ", so a canvas or anything else can be dropped in later without a format change."
          - separator [ref=f55e496]
          - heading "The hard questions, decided" [level=2] [ref=f55e497]
          - paragraph [ref=f55e498]: These were open in v0.2. Each one now has an answer, with the residual risk stated rather than hidden.
          - heading "1. Docs that exist on several git branches at once" [level=3] [ref=f55e499]
          - paragraph [ref=f55e500]:
            - strong [ref=f55e501]: "Decision: one canonical version per doc identity. Galley never holds two versions of the same doc, and a branch variant is not a fork — it's a divergence to be reviewed."
          - paragraph [ref=f55e502]:
            - text: The
            - code [ref=f55e503]: "galley:"
            - text: frontmatter ULID is the identity, and it is deliberately
            - emphasis [ref=f55e504]: not
            - text: a git ref. Comments, citations, suggestions, and history attach to
            - code [ref=f55e505]: doc-identity#block
            - text: "and nothing else. When a mirrored file's content stops matching the canonical version — which is exactly what a branch switch looks like — the whole-file replacement rule from the filesystem table fires: the session ends, and the file is marked"
            - strong [ref=f55e506]: diverged
            - text: rather than ingested. A diverged file is not silently promoted into the doc; editing it produces suggestions against canonical, reviewed like any other.
          - paragraph [ref=f55e507]: "The consequence to accept: a block that exists only on a feature branch has no anchor, so a comment left on it orphans into the tray. That's correct behavior — a comment on a paragraph that doesn't exist in the canonical doc has nowhere honest to live."
          - paragraph [ref=f55e508]: "Why this is right rather than merely simple: docs drift across branches far less than code does, and the alternative — per-branch doc variants — splits the comment ecosystem in two, which is the one thing that makes the annotation layer worthless. Galley stays free of git vocabulary because the divergence is expressed in Galley's own primitives."
          - paragraph [ref=f55e509]:
            - emphasis [ref=f55e510]:
              - text: (This gets easier still if the checkout model in
              - code [ref=f55e511]: tradeoffs.md
              - text: "is taken: a branch becomes a checkout that hasn't been pushed, and the same suggestion path covers it.)"
          - heading "2. How a cloud-native doc reaches a repo" [level=3] [ref=f55e512]
          - paragraph [ref=f55e513]:
            - strong [ref=f55e514]: "Decision: server-side. A Galley GitHub app writes to the repo on the workspace's behalf. The repo is a publishing target, not a peer of the CRDT."
          - paragraph [ref=f55e515]: The workspace declares a map — doc path in Galley → path in the repo → branch — and Galley commits accepted changes itself. The default is a single long-lived PR per doc, updated in place, so review lands in the reviewer's existing workflow; teams that don't want the ceremony can configure direct commits to a designated branch. The PM who wrote the doc never clones anything.
          - paragraph [ref=f55e516]:
            - text: Inbound commits on a mapped path arrive as external edits attributed to
            - code [ref=f55e517]: git
            - text: ", through the same path as any other external edit. A teammate's local mirror is then just an ordinary checkout of that branch, and stops being load-bearing."
          - paragraph [ref=f55e518]: "Residual risk: the app needs write scope on the repo, which is a real security conversation with any customer whose docs live next to their code. Read-only mode with export-a-patch is the fallback for teams that won't grant it."
          - heading "3. Anchor loss under agent rewriting" [level=3] [ref=f55e519]
          - paragraph [ref=f55e520]:
            - strong [ref=f55e521]: "Decision: don't measure the risk, remove it. The CLI refuses whole-document replacement for any doc with durable anchors."
          - paragraph [ref=f55e522]:
            - code [ref=f55e523]: galley suggest
            - text: takes block-scoped operations — replace, insert, delete, move — each carrying identity. "Rewrite this whole section" is expressed as a sequence of those, not as a new blob of text, so identity flows through by construction rather than by fuzzy matching after the fact. Anchor loss becomes possible only where an agent explicitly deletes a block, which is semantically the right place to lose one. The skill teaches the etiquette; the CLI enforces the shape, because etiquette that isn't enforced is a suggestion to a model.
          - paragraph [ref=f55e524]:
            - text: "This still needs a number, so it becomes an acceptance gate rather than an unknown: a benchmark corpus of real agent rewrites over commented docs, run in CI, gating build step 3."
            - strong [ref=f55e525]: ≥95% anchor survival, zero silent misattachments.
            - text: A misattachment is a bug of a different class than an orphan and is never traded off against the survival rate.
          - heading "4. An agent acting for an absent human" [level=3] [ref=f55e526]
          - paragraph [ref=f55e527]:
            - strong [ref=f55e528]: "Decision: an agent is a first-class principal with its own identity. Never impersonation."
          - paragraph [ref=f55e529]:
            - code [ref=f55e530]: galley auth login
            - text: issues a token to an
            - emphasis [ref=f55e531]: (agent, sponsor)
            - text: pair. The agent's permissions are the intersection of the sponsor's grants and the token's declared scope — always a subset, never equal to the human's. The audit trail records both, and reads as
            - code [ref=f55e532]: galley-bot/ci, sponsored by priya
            - text: . The agent is the actor; the sponsor is accountable for the grant.
          - paragraph [ref=f55e533]: "What follows:"
          - list [ref=f55e534]:
            - listitem [ref=f55e535]:
              - paragraph [ref=f55e536]: Revoking a human's access revokes every token they sponsor. No orphaned 3am agents.
            - listitem [ref=f55e537]:
              - paragraph [ref=f55e538]: Agents cannot sponsor agents. Delegation chains terminate at a person.
            - listitem [ref=f55e539]:
              - paragraph [ref=f55e540]: "A suggestion authored by an agent is never auto-accepted, including by rules the sponsor wrote. Suggestion-by-default is what makes an absent sponsor a non-problem: nothing lands while they're asleep."
          - heading "5. Desktop app or File System Access API" [level=3] [ref=f55e541]
          - paragraph [ref=f55e542]:
            - strong [ref=f55e543]: "Decision: neither is the mechanism. The CLI is the local mirror."
          - paragraph [ref=f55e544]:
            - code [ref=f55e545]: galley pull
            - text: "is already a binary that puts files on disk, and it's the surface agents use anyway — shipping a desktop app to do the same job buys no capability and costs a distribution channel, code-signing, and an update story. The File System Access API ships as a convenience for the browser-only user who wants a folder open, with its limits stated plainly: Chromium-only, per-session permission prompts, no background watching. If a user needs the mirror to be reliable, they install the CLI."
          - heading "6. Does a doc have an owner, or does a workspace?" [level=3] [ref=f55e546]
          - paragraph [ref=f55e547]:
            - strong [ref=f55e548]: "Decision: both, doing different jobs — and only one of them is a permission."
          - paragraph [ref=f55e549]:
            - text: The
            - strong [ref=f55e550]: workspace
            - text: "owns access: membership, permissions, billing. Permissions never come from a doc-level field, which is what keeps this out of per-doc ACL territory."
          - paragraph [ref=f55e551]:
            - text: The
            - strong [ref=f55e552]: doc
            - text: has an
            - code [ref=f55e553]: "owner:"
            - text: "— an accountability field, a person, defaulting to the creator and freely reassignable. It routes the things that need a human: the staleness nudge (\"this doc feeds three agents and hasn't been touched in 90 days\"), suggestions nobody has reviewed, and orphaned anchors waiting in the tray. An unowned doc is a doc whose staleness is nobody's problem, which is how docs rot."
          - separator [ref=f55e554]
          - heading "Still genuinely unknown" [level=3] [ref=f55e555]
          - paragraph [ref=f55e556]: Not open problems in the above sense — things that only measurement answers.
          - list [ref=f55e557]:
            - listitem [ref=f55e558]:
              - paragraph [ref=f55e559]:
                - text: "Whether the ≥95% anchor-survival gate in #3 is achievable at the first attempt, or whether the block-op vocabulary needs a"
                - code [ref=f55e560]: move
                - text: semantic richer than the obvious one.
            - listitem [ref=f55e561]:
              - paragraph [ref=f55e562]: Whether teams will grant repo write scope (#2) often enough that the server-side path is the main one, or whether read-only-plus-patch becomes the default in practice.
          - separator [ref=f55e563]
          - heading "What will actually kill this" [level=2] [ref=f55e564]
          - list [ref=f55e565]:
            - listitem [ref=f55e566]:
              - paragraph [ref=f55e567]:
                - strong [ref=f55e568]: Round-trip fidelity.
                - text: Covered above. If someone's
                - code [ref=f55e569]: git diff
                - text: shows noise they didn't create, the credibility is gone permanently and you don't get it back.
            - listitem [ref=f55e570]:
              - paragraph [ref=f55e571]:
                - strong [ref=f55e572]: Filesystem edge cases.
                - text: The table above, plus the ones not in it yet. Budget more than feels reasonable.
            - listitem [ref=f55e573]:
              - paragraph [ref=f55e574]:
                - strong [ref=f55e575]: Agent slop.
                - text: Nineteen comments, or a suggestion that rewrites a document into confident mush. Budgets, scoping, and suggestion-by-default are the defenses, and they have to be defaults rather than settings.
            - listitem [ref=f55e576]:
              - paragraph [ref=f55e577]:
                - strong [ref=f55e578]: Positioning drift.
                - text: "The moment this says \"and also wikis, and also project management,\" it's Notion-but-worse. The scope is: a writing surface whose output is machine-consumable. Stay there."
            - listitem [ref=f55e579]:
              - paragraph [ref=f55e580]:
                - strong [ref=f55e581]: Building an editor for three years before learning anything.
                - text: Which is what the build order above exists to prevent.
      - complementary [ref=f55e582]:
        - paragraph [ref=f55e583]: No notes yet. Select any text and press ⌘⌥M to leave one.